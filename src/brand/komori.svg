  <title id="title">Komori pastel book and cat logo</title>
  <desc id="description">A coral and cream open book with rounded cat ears, a flowing mauve tail, a floating pink petal, and a five-petal sakura blossom. All artwork consists of editable Bézier paths and subtle pastel gradients on a transparent background.</desc>
