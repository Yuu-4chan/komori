[package]
name = "komori"
version = "2.3.0"
description = "A lightweight desktop reading application"
authors = ["The Komori authors"]
license = "GPL-3.0-or-later"
edition = "2021"

[lib]
name = "komori_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
base64 = "0.22"
flate2 = "1"
roxmltree = "0.21"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
# float_roundtrip: a place's progress must cross the phone-PC link as the very number it was.
serde_json = { version = "1", features = ["raw_value", "float_roundtrip"] }
sha2 = "0.10"
ttf-parser = "0.25"
uuid = { version = "1", features = ["v4"] }
zip = { version = "8.6", default-features = false, features = ["deflate"] }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp", "tiff"] }
# Word audio uses the HTTP client and TLS the updater brings on the PC.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
percent-encoding = "2"
# Pairing a phone with the PC: the PC's own TLS identity, the code-based key exchange, and the
# proofs both sides send over it.
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring"] }
spake2 = "0.4"
hmac = "0.12"
getrandom = "0.3"
# Series from titles needs Unicode punctuation classes; Tauri already brings the crate.
regex = "1.13"
# The phone's updates: comparing release versions and checking the APK's signature, as the PC's
# updater plugin does with the same crates.
semver = "1"
minisign-verify = "0.2"

# The PC's file dialogs, single window and updater; Android has its own document picker, and
# its updates are read and checked by Komori and installed by Android.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
rfd = "0.17"
tauri-plugin-single-instance = "~2.3.6"
tauri-plugin-updater = { version = "~2.12.0", default-features = false, features = ["rustls-tls"] }

# Android's own certificate check needs Java set up from the app; the phone trusts Mozilla's roots.
[target.'cfg(target_os = "android")'.dependencies]
webpki-root-certs = "1"

[target.'cfg(windows)'.dependencies]
webview2-com = "0.38.2"
windows = { version = "0.61", features = ["Win32_System_Com"] }
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Networking_WinHttp",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_System_Registry",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

# Development builds decode covers and read archives at close to their real speed; without this,
# adding a book takes fifteen times as long as in a release.
[profile.dev.package."*"]
opt-level = 2

[dev-dependencies]
tempfile = "3"

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_System_LibraryLoader",
  "Win32_System_Threading",
] }
